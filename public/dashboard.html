<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIOSAVEUR - Tableau de Bord Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    
    header {
      background: #2e7d32;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 20px; }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      padding: 20px;
    }
    
    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .stat-card h2 { font-size: 36px; color: #2e7d32; }
    .stat-card p { color: #666; margin-top: 5px; }

    .section {
      margin: 0 20px 20px;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .section h3 { color: #2e7d32; margin-bottom: 15px; font-size: 18px; }

    table { width: 100%; border-collapse: collapse; }
    th { background: #2e7d32; color: white; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    tr:hover { background: #f9f9f9; }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-client { background: #e8f5e9; color: #2e7d32; }
    .badge-admin { background: #fff3e0; color: #e65100; }

    .btn {
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-green { background: #2e7d32; color: white; }
    .btn-red { background: #c62828; color: white; }

    .qr-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .qr-modal.active { display: flex; }
    .qr-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }
    .qr-box img { width: 200px; margin: 15px 0; }
    .logout { background: #c62828; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>🐔 BIOSAVEUR — Tableau de Bord</h1>
  <button class="logout" onclick="deconnexion()">Déconnexion</button>
</header>

<div class="stats">
  <div class="stat-card">
    <h2 id="total-clients">0</h2>
    <p>Clients inscrits</p>
  </div>
  <div class="stat-card">
    <h2 id="total-commandes">0</h2>
    <p>Commandes</p>
  </div>
  <div class="stat-card">
    <h2 id="total-livraisons">0</h2>
    <p>Livraisons effectuées</p>
  </div>
</div>

<div class="section">
  <h3>👥 Liste des Clients</h3>
      <button class="btn btn-green" style="margin-bottom:15px" onclick="afficherFormulaireClient()">+ Ajouter un client</button>
      <div id="form-nouveau-client" style="display:none; background:#f9f9f9; padding:20px; border-radius:8px; margin-bottom:20px">
        <h4 style="margin-bottom:15px; color:#2e7d32">Nouveau Client</h4>
        <input type="text" id="new-nom" placeholder="Nom" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:5px">
        <input type="text" id="new-prenom" placeholder="Prénom" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:5px">
        <input type="tel" id="new-tel" placeholder="Téléphone" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:5px">
        <input type="password" id="new-mdp" placeholder="Mot de passe" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:5px">
        <button class="btn btn-green" onclick="ajouterClient()">Enregistrer</button>
        <button class="btn btn-red" style="margin-left:10px" onclick="document.getElementById('form-nouveau-client').style.display='none'">Annuler</button>
      </div>
  <table>
    <thead>
      <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Téléphone</th>
        <th>Rôle</th>
        <th>QR Code</th>
      </tr>
    </thead>
    <tbody id="clients-table">
      <tr><td colspan="5" style="text-align:center">Chargement...</td></tr>
    </tbody>
  </table>
</div>

<!-- QR Code Modal -->
<div class="qr-modal" id="qr-modal">
  <div class="qr-box">
    <h3>QR Code Client</h3>
    <img id="qr-image" src="" alt="QR Code">
    <br>
    <button class="btn btn-red" onclick="fermerQR()">Fermer</button>
  </div>
</div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/';

  async function chargerClients() {
    try {
      const res = await fetch('/api/admin/clients', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      
      if (!res.ok) {
        window.location.href = '/';
        return;
      }

      document.getElementById('total-clients').textContent = data.length;

      const tbody = document.getElementById('clients-table');
      tbody.innerHTML = '';
      
      data.forEach(client => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${client.nom}</td>
          <td>${client.prenom}</td>
          <td>${client.telephone}</td>
          <td><span class="badge badge-${client.role}">${client.role}</span></td>
          <td>
            ${client.qrCode ? 
              `<button class="btn btn-green" onclick="voirQR('${client.qrCode}')">Voir QR</button>` : 
              'Pas de QR'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    } catch (err) {
      console.log('Erreur:', err);
    }
  }

  function voirQR(qrCode) {
    document.getElementById('qr-image').src = qrCode;
    document.getElementById('qr-modal').classList.add('active');
  }

  function fermerQR() {
    document.getElementById('qr-modal').classList.remove('active');
  }

  function afficherFormulaireClient() {
    const form = document.getElementById("form-nouveau-client");
    form.style.display = form.style.display === "none" ? "block" : "none";
  }

  async function ajouterClient() {
    const nom = document.getElementById("new-nom").value;
    const prenom = document.getElementById("new-prenom").value;
    const telephone = document.getElementById("new-tel").value;
    const motDePasse = document.getElementById("new-mdp").value;
    const token = localStorage.getItem("token");
    const res = await fetch("/api/auth/inscription", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ nom, prenom, telephone, motDePasse })
    });
    const data = await res.json();
    if (res.ok) {
      alert("Client ajouté avec succès !");
      document.getElementById("form-nouveau-client").style.display = "none";
      chargerClients();
    } else {
      alert("Erreur : " + data.message);
    }
  }

  function deconnexion() {
    localStorage.removeItem('token');
    window.location.href = '/';
  }

  chargerClients();
</script>

<section id="section-cotisations" style="margin:20px">
<h3 style="color:#2e7d32;margin-bottom:15px">💰 Cotisations Poulet Molo Molo</h3>
<button class="btn btn-green" style="margin-bottom:15px" onclick="afficherFormCotisation()">+ Nouvelle cotisation</button>
<div id="form-cotisation" style="display:none;background:#f9f9f9;padding:20px;border-radius:8px;margin-bottom:20px">
<h4 style="margin-bottom:15px;color:#2e7d32">Créer une cotisation</h4>
<select id="cot-client" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:5px"><option value="">-- Choisir un client --</option></select>
<input type="number" id="cot-poulets" placeholder="Nombre de poulets souhaités" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:5px">
<input type="number" id="cot-prix" placeholder="Prix unitaire (défaut: 2800 FCFA)" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:5px">
<input type="month" id="cot-mois" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:5px">
<button class="btn btn-green" onclick="creerCotisation()">Créer</button>
<button class="btn btn-red" style="margin-left:10px" onclick="document.getElementById('form-cotisation').style.display='none'">Annuler</button>
</div>
<div id="liste-cotisations"></div>
</section>
</body>
</html>
