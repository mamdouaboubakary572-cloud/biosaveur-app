<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOSAVEUR - Tableau de Bord Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f5f5f5; }
header { background: #2e7d32; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
header h1 { font-size: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; }
.stat-card { background: white; border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.stat-card h2 { font-size: 36px; color: #2e7d32; }
.stat-card p { color: #666; margin-top: 5px; }
.section { margin: 0 20px 20px; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.section h3 { color: #2e7d32; margin-bottom: 15px; font-size: 18px; }
table { width: 100%; border-collapse: collapse; }
th { background: #2e7d32; color: white; padding: 10px; text-align: left; }
td { padding: 10px; border-bottom: 1px solid #eee; }
tr:hover { background: #f9f9f9; }
.btn { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
.btn-green { background: #2e7d32; color: white; }
.btn-red { background: #c62828; color: white; }
.badge { padding: 3px 8px; border-radius: 5px; font-size: 12px; }
.badge-client { background: #e8f5e9; color: #2e7d32; }
.form-box { display: none; background: #f9f9f9; padding: 20px; border-radius: 8px; margin: 15px 0; }
.form-box h4 { color: #2e7d32; margin-bottom: 15px; }
input, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
.logout { background: #c62828; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
.progress-bar { background: #eee; border-radius: 10px; height: 10px; margin-top: 5px; }
.progress-fill { background: #2e7d32; border-radius: 10px; height: 10px; }
</style>
</head>
<body>
<header>
  <h1>🐔 BIOSAVEUR — Tableau de Bord</h1>
  <button class="logout" onclick="deconnexion()">Déconnexion</button>
</header>

<div class="stats">
  <div class="stat-card"><h2 id="total-clients">0</h2><p>Clients inscrits</p></div>
  <div class="stat-card"><h2 id="total-commandes">0</h2><p>Commandes</p></div>
  <div class="stat-card"><h2 id="total-livraisons">0</h2><p>Livraisons effectuées</p></div>
</div>

<div class="section">
  <h3>👥 Liste des Clients</h3>
  <button class="btn btn-green" style="margin-bottom:15px" onclick="afficherFormClient()">+ Ajouter un client</button>
  <div class="form-box" id="form-client">
    <h4>Nouveau Client</h4>
    <input type="text" id="new-nom" placeholder="Nom">
    <input type="text" id="new-prenom" placeholder="Prénom">
    <input type="tel" id="new-tel" placeholder="Téléphone">
    <input type="password" id="new-mdp" placeholder="Mot de passe">
    <button class="btn btn-green" onclick="ajouterClient()">Enregistrer</button>
    <button class="btn btn-red" style="margin-left:10px" onclick="fermerForm('form-client')">Annuler</button>
  </div>
  <table>
    <thead><tr><th>Nom</th><th>Prénom</th><th>Téléphone</th><th>Rôle</th><th>QR Code</th></tr></thead>
    <tbody id="clients-table"></tbody>
  </table>
</div>

<div class="section">
  <h3>💰 Cotisations Poulet Molo Molo</h3>
  <button class="btn btn-green" style="margin-bottom:15px" onclick="afficherFormCotisation()">+ Nouvelle cotisation</button>
  <div class="form-box" id="form-cotisation">
    <h4>Créer une cotisation</h4>
    <select id="cot-client"><option value="">-- Choisir un client --</option></select>
    <input type="number" id="cot-poulets" placeholder="Nombre de poulets souhaités">
    <input type="number" id="cot-prix" placeholder="Prix unitaire (défaut: 2800 FCFA)">
    <input type="month" id="cot-mois">
    <button class="btn btn-green" onclick="creerCotisation()">Créer</button>
    <button class="btn btn-red" style="margin-left:10px" onclick="fermerForm('form-cotisation')">Annuler</button>
  </div>
  <div id="liste-cotisations"></div>
</div>

<div id="modal-qr" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center">
  <div style="background:white;padding:30px;border-radius:10px;text-align:center">
    <div id="qr-content"></div>
    <button class="btn btn-red" style="margin-top:15px" onclick="fermerQR()">Fermer</button>
  </div>
</div>

<script>
const token = localStorage.getItem("token");
if (!token) window.location.href = "/";

function fermerForm(id) { document.getElementById(id).style.display = "none"; }
function afficherFormClient() { const f = document.getElementById("form-client"); f.style.display = f.style.display === "none" ? "block" : "none"; }
function afficherFormCotisation() { const f = document.getElementById("form-cotisation"); f.style.display = f.style.display === "none" ? "block" : "none"; }
function voirQR(qrCode) { document.getElementById("qr-content").innerHTML = "<img src='" + qrCode + "' style='max-width:200px'>"; document.getElementById("modal-qr").style.display = "flex"; }
function fermerQR() { document.getElementById("modal-qr").style.display = "none"; }
function deconnexion() { localStorage.removeItem("token"); window.location.href = "/"; }

async function chargerClients() {
  const res = await fetch("/api/admin/clients", { headers: { "Authorization": "Bearer " + token } });
  const data = await res.json();
  document.getElementById("total-clients").textContent = data.length;
  const tbody = document.getElementById("clients-table");
  tbody.innerHTML = "";
  data.forEach(c => {
    tbody.innerHTML += "<tr><td>" + c.nom + "</td><td>" + c.prenom + "</td><td>" + c.telephone + "</td><td><span class='badge badge-client'>" + c.role + "</span></td><td>" + (c.qrCode ? "<button class='btn btn-green' onclick='voirQR(\"" + c.qrCode + "\")'>Voir QR</button>" : "-") + "</td></tr>";
  });
  const select = document.getElementById("cot-client");
  select.innerHTML = "<option value=''>-- Choisir un client --</option>";
  data.forEach(c => { select.innerHTML += "<option value='" + c._id + "'>" + c.nom + " " + c.prenom + "</option>"; });
}

async function ajouterClient() {
  const nom = document.getElementById("new-nom").value;
  const prenom = document.getElementById("new-prenom").value;
  const telephone = document.getElementById("new-tel").value;
  const motDePasse = document.getElementById("new-mdp").value;
  const res = await fetch("/api/auth/inscription", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }, body: JSON.stringify({ nom, prenom, telephone, motDePasse }) });
  const data = await res.json();
  if (res.ok) { alert("Client ajouté !"); fermerForm("form-client"); chargerClients(); }
  else { alert("Erreur: " + data.message); }
}

async function chargerCotisations() {
  const res = await fetch("/api/cotisations", { headers: { "Authorization": "Bearer " + token } });
  const data = await res.json();
  const div = document.getElementById("liste-cotisations");
  if (!data.length) { div.innerHTML = "<p style='color:#888;margin-top:10px'>Aucune cotisation.</p>"; return; }
  let html = "<table style='margin-top:15px'><thead><tr><th>Client</th><th>Mois</th><th>Objectif</th><th>Collecté</th><th>Progression</th><th>Statut</th><th>Action</th></tr></thead><tbody>";
  data.forEach(c => {
    const pct = Math.min(Math.round((c.montantCollecte / c.montantObjectif) * 100), 100);
    const couleur = c.statut === "complete" ? "#2e7d32" : c.statut === "livre" ? "#1565c0" : "#f57c00";
    html += "<tr><td>" + c.client.nom + " " + c.client.prenom + "</td><td>" + c.mois + "</td><td>" + c.montantObjectif + " FCFA<br><small>" + c.objectifPoulets + " poulet(s)</small></td><td>" + c.montantCollecte + " FCFA</td><td><div class='progress-bar'><div class='progress-fill' style='width:" + pct + "%'></div></div><small>" + pct + "%</small></td><td><span style='background:" + couleur + ";color:white;padding:3px 8px;border-radius:5px;font-size:12px'>" + c.statut + "</span></td><td><button class='btn btn-green' style='font-size:12px' onclick='ajouterVersement(\"" + c._id + "\")'>+ Versement</button></td></tr>";
  });
  html += "</tbody></table>";
  div.innerHTML = html;
}

async function creerCotisation() {
  const clientId = document.getElementById("cot-client").value;
  const objectifPoulets = parseInt(document.getElementById("cot-poulets").value);
  const prixUnitaire = parseInt(document.getElementById("cot-prix").value) || 2800;
  const mois = document.getElementById("cot-mois").value;
  if (!clientId || !objectifPoulets || !mois) { alert("Remplissez tous les champs"); return; }
  const res = await fetch("/api/cotisations", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }, body: JSON.stringify({ clientId, objectifPoulets, prixUnitaire, mois }) });
  const data = await res.json();
  if (res.ok) { alert("Cotisation créée !"); fermerForm("form-cotisation"); chargerCotisations(); }
  else { alert("Erreur: " + data.message); }
}

async function ajouterVersement(cotisationId) {
  const montant = prompt("Montant du versement (FCFA):");
  if (!montant) return;
  const modePaiement = prompt("Mode de paiement (Wave / Orange Money / Moov Money):");
  const res = await fetch("/api/cotisations/" + cotisationId + "/versement", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }, body: JSON.stringify({ montant: parseInt(montant), modePaiement }) });
  const data = await res.json();
  if (res.ok) { alert("Versement enregistré !"); chargerCotisations(); }
  else { alert("Erreur: " + data.message); }
}

chargerClients();
chargerCotisations();
</script>
</body>
</html>
