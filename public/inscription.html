<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOSAVEUR – Inscription</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Alan Sans','Segoe UI',Arial,system-ui,sans-serif;background:#f4f6f4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:white;border-radius:16px;padding:36px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,0.10);}
.logo{text-align:center;margin-bottom:24px;}
.logo-title{font-size:22px;font-weight:700;color:#103d3a;margin-top:8px;}
.logo-sub{font-size:13px;color:#5a7060;margin-top:4px;}
.form-group{margin-bottom:14px;}
label{display:block;font-size:13px;font-weight:600;color:#1a2e1f;margin-bottom:6px;}
input{width:100%;padding:11px 14px;border:1.5px solid #e0e8e2;border-radius:8px;font-size:14px;outline:none;}
input:focus{border-color:#103d3a;}
.btn{width:100%;padding:12px;background:#103d3a;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}
.btn:disabled{background:#8fa896;}
.error{background:#fdecea;color:#c0392b;border:1px solid #f5c6c2;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#8fa896;}
.footer a{color:#103d3a;font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/logo_biosaveur.png" alt="Biosaveur" style="height:60px;width:auto;">
    <div class="logo-title">Rejoindre BIOSAVEUR</div>
    <div class="logo-sub">Créez votre compte en 1 minute</div>
  </div>
  <div class="error" id="erreur"></div>
  <div class="form-group">
    <label>Nom *</label>
    <input type="text" id="nom" placeholder="Votre nom">
  </div>
  <div class="form-group">
    <label>Prénom *</label>
    <input type="text" id="prenom" placeholder="Votre prénom">
  </div>
  <div class="form-group">
    <label>Téléphone *</label>
    <input type="tel" id="telephone" placeholder="Ex: 0708090000">
  </div>
  <div class="form-group">
    <label>Mot de passe *</label>
    <input type="password" id="motDePasse" placeholder="Choisissez un mot de passe">
  </div>
  <div class="form-group">
    <label>Code de parrainage (optionnel)</label>
    <input type="text" id="codeParrain" placeholder="Ex: BSV-XXXX">
  </div>
  <button class="btn" id="btn-inscription" onclick="sInscrire()">S'inscrire</button>
  <div class="footer">Déjà client ? <a href="/">Se connecter</a></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const codeUrl = params.get('parrain');
if (codeUrl) document.getElementById('codeParrain').value = codeUrl;

document.getElementById('motDePasse').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sInscrire();
});

async function sInscrire() {
  const nom = document.getElementById('nom').value.trim();
  const prenom = document.getElementById('prenom').value.trim();
  const telephone = document.getElementById('telephone').value.trim();
  const motDePasse = document.getElementById('motDePasse').value.trim();
  const codeParrainSaisi = document.getElementById('codeParrain').value.trim();
  const errDiv = document.getElementById('erreur');
  const btn = document.getElementById('btn-inscription');
  errDiv.style.display = 'none';

  if (!nom || !prenom || !telephone || !motDePasse) {
    errDiv.textContent = 'Veuillez remplir tous les champs obligatoires.';
    errDiv.style.display = 'block';
    return;
  }
  if (motDePasse.length < 4) {
    errDiv.textContent = 'Le mot de passe doit contenir au moins 4 caractères.';
    errDiv.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Inscription...';

  try {
    const res = await fetch('/api/auth/inscription-publique', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nom, prenom, telephone, motDePasse, codeParrainSaisi })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('role', 'client');
      localStorage.setItem('user-nom', nom + ' ' + prenom);
      alert('✅ Bienvenue chez BIOSAVEUR, ' + prenom + ' !');
      window.location.href = '/client.html';
    } else {
      errDiv.textContent = data.message || 'Erreur lors de l\'inscription.';
      errDiv.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'S\'inscrire';
    }
  } catch (err) {
    errDiv.textContent = 'Erreur de connexion au serveur.';
    errDiv.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'S\'inscrire';
  }
}
</script>
</body>
</html>
