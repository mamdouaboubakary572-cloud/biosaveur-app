<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOSAVEUR – Connexion QR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6f4;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:white;border-radius:16px;padding:40px;text-align:center;max-width:360px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,0.10);}
.logo{font-size:48px;margin-bottom:16px;}
.titre{font-size:18px;font-weight:700;color:#1a6b3c;margin-bottom:8px;}
.sous-titre{font-size:13px;color:#5a7060;margin-bottom:24px;}
.spinner{width:40px;height:40px;border:3px solid #e0e8e2;border-top-color:#1a6b3c;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.error{background:#fdecea;color:#c0392b;border-radius:8px;padding:12px;font-size:13px;margin-top:16px;}
.btn{background:#1a6b3c;color:white;border:none;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:16px;width:100%;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🐓</div>
  <div class="titre">BIOSAVEUR</div>
  <div class="sous-titre">Connexion en cours...</div>
  <div class="spinner" id="spinner"></div>
  <div id="message"></div>
</div>
<script>
async function connecterViaQR() {
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('id');

  if (!userId) {
    afficherErreur('QR code invalide.');
    return;
  }

  try {
    const res = await fetch('/api/auth/qr/' + userId);
    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('role', data.user.role);
      localStorage.setItem('user-nom', data.user.nom + ' ' + data.user.prenom);
      window.location.href = '/client.html';
    } else {
      afficherErreur(data.message || 'Erreur de connexion.');
    }
  } catch (e) {
    afficherErreur('Erreur serveur. Réessayez.');
  }
}

function afficherErreur(msg) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('message').innerHTML =
    '<div class="error">' + msg + '</div>' +
    '<button class="btn" onclick="window.location.href=\'/\'">Se connecter manuellement</button>';
}

connecterViaQR();
</script>
</body>
</html>
