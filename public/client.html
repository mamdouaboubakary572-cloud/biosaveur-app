<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOSAVEUR - Mon Espace</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f5f5f5; }
header { background: #2e7d32; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
header h1 { font-size: 18px; }
.logout { background: #c62828; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
.container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
.card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.card h2 { color: #2e7d32; margin-bottom: 15px; font-size: 18px; }
.stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
.stat-label { color: #666; }
.stat-value { font-weight: bold; color: #2e7d32; }
.progress-bar { background: #eee; border-radius: 10px; height: 20px; margin: 10px 0; overflow: hidden; }
.progress-fill { background: #2e7d32; border-radius: 10px; height: 20px; transition: width 0.5s; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; }
.badge { padding: 4px 10px; border-radius: 5px; font-size: 13px; font-weight: bold; }
.badge-en_cours { background: #fff3e0; color: #f57c00; }
.badge-complete { background: #e8f5e9; color: #2e7d32; }
.badge-livre { background: #e3f2fd; color: #1565c0; }
.versement-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
.versement-item:last-child { border-bottom: none; }
.no-data { color: #888; text-align: center; padding: 20px; }
.welcome { text-align: center; padding: 10px 0 20px; }
.welcome h3 { font-size: 22px; color: #2e7d32; }
.welcome p { color: #666; margin-top: 5px; }
</style>
</head>
<body>
<header>
  <h1>🐔 BIOSAVEUR — Mon Espace</h1>
  <button class="logout" onclick="deconnexion()">Déconnexion</button>
</header>

<div class="container">
  <div class="card welcome">
    <h3 id="nom-client">Bonjour !</h3>
    <p>Voici le suivi de vos cotisations Poulet Molo Molo</p>
  </div>

  <div id="cotisations-container">
    <p class="no-data">Chargement...</p>
  </div>
</div>

<script>
const token = localStorage.getItem("token");
if (!token) window.location.href = "/";

function deconnexion() { localStorage.removeItem("token"); window.location.href = "/"; }

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString("fr-FR");
}

async function chargerMonEspace() {
  const res = await fetch("/api/cotisations/mes-cotisations", { headers: { "Authorization": "Bearer " + token } });
  const data = await res.json();
  const container = document.getElementById("cotisations-container");

  if (!data.length) {
    container.innerHTML = "<div class='card'><p class='no-data'>Aucune cotisation en cours.<br>Contactez BIOSAVEUR pour démarrer votre épargne.</p></div>";
    return;
  }

  let html = "";
  data.forEach(c => {
    const pct = Math.min(Math.round((c.montantCollecte / c.montantObjectif) * 100), 100);
    const restant = c.montantObjectif - c.montantCollecte;
    const versementsHTML = c.versements.length ? c.versements.map(v =>
      "<div class='versement-item'><span>📅 " + formatDate(v.date) + " — " + (v.modePaiement || "Wave") + "</span><span style='color:#2e7d32;font-weight:bold'>+" + v.montant.toLocaleString() + " FCFA</span></div>"
    ).join("") : "<p class='no-data'>Aucun versement encore.</p>";

    html += "<div class='card'>" +
      "<h2>📅 " + c.mois + " — " + c.objectifPoulets + " poulet(s)</h2>" +
      "<div class='stat-row'><span class='stat-label'>Objectif</span><span class='stat-value'>" + c.montantObjectif.toLocaleString() + " FCFA</span></div>" +
      "<div class='stat-row'><span class='stat-label'>Déjà payé</span><span class='stat-value'>" + c.montantCollecte.toLocaleString() + " FCFA</span></div>" +
      "<div class='stat-row'><span class='stat-label'>Reste à payer</span><span class='stat-value' style='color:" + (restant > 0 ? "#f57c00" : "#2e7d32") + "'>" + (restant > 0 ? restant.toLocaleString() + " FCFA" : "✅ Complété !") + "</span></div>" +
      "<div class='stat-row'><span class='stat-label'>Statut</span><span class='badge badge-" + c.statut + "'>" + (c.statut === "en_cours" ? "⏳ En cours" : c.statut === "complete" ? "✅ Complété" : "🚚 Livré") + "</span></div>" +
      "<div class='progress-bar'><div class='progress-fill' style='width:" + pct + "%'>" + (pct > 10 ? pct + "%" : "") + "</div></div>" +
      "<h3 style='margin-top:15px;margin-bottom:10px;color:#2e7d32;font-size:15px'>Historique des versements</h3>" +
      versementsHTML +
      "</div>";
  });

  container.innerHTML = html;
}

async function chargerProfil() {
  try {
    const payload = JSON.parse(atob(token.split(".")[1]));
    document.getElementById("nom-client").textContent = "Bonjour " + (payload.nom || "") + " !";
  } catch(e) {}
}

chargerProfil();
chargerMonEspace();
</script>
</body>
</html>
