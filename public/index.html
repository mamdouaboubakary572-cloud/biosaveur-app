<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOSAVEUR – Connexion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6f4;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:white;border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,0.10);}
.logo{text-align:center;margin-bottom:28px;}
.logo-icon{font-size:48px;display:block;margin-bottom:8px;}
.logo-title{font-size:22px;font-weight:700;color:#1a6b3c;letter-spacing:-0.3px;}
.logo-sub{font-size:13px;color:#5a7060;margin-top:4px;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:13px;font-weight:600;color:#1a2e1f;margin-bottom:6px;}
input{width:100%;padding:11px 14px;border:1.5px solid #e0e8e2;border-radius:8px;font-size:14px;color:#1a2e1f;outline:none;transition:border .2s;}
input:focus{border-color:#1a6b3c;}
.btn{width:100%;padding:12px;background:#1a6b3c;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .2s;}
.btn:hover{background:#2d8653;}
.btn:disabled{background:#8fa896;cursor:not-allowed;}
.error{background:#fdecea;color:#c0392b;border:1px solid #f5c6c2;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#8fa896;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">🐓</span>
    <div class="logo-title">BIOSAVEUR</div>
    <div class="logo-sub">Poulet Molo Molo – Administration</div>
  </div>

  <div class="error" id="erreur"></div>

  <div class="form-group">
    <label>Téléphone</label>
    <input type="tel" id="telephone" placeholder="Ex: 0708090000" autocomplete="tel">
  </div>
  <div class="form-group">
    <label>Mot de passe</label>
    <input type="password" id="motDePasse" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" id="btn-connexion" onclick="seConnecter()">Se connecter</button>

  <div class="footer">BIOSAVEUR © 2025 – Vous Savez Ce Que Vous Mangez</div>
</div>

<script>
// Si déjà connecté, aller au dashboard
if (localStorage.getItem('token')) {
  window.location.href = '/dashboard.html';
}

document.getElementById('motDePasse').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') seConnecter();
});

async function seConnecter() {
  const telephone = document.getElementById('telephone').value.trim();
  const motDePasse = document.getElementById('motDePasse').value.trim();
  const errDiv = document.getElementById('erreur');
  const btn = document.getElementById('btn-connexion');

  errDiv.style.display = 'none';

  if (!telephone || !motDePasse) {
    errDiv.textContent = 'Veuillez remplir tous les champs.';
    errDiv.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Connexion...';

  try {
    const res = await fetch('/api/auth/connexion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telephone, motDePasse })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('admin-nom', data.user.nom + ' ' + data.user.prenom);
      window.location.href = '/dashboard.html';
    } else {
      errDiv.textContent = data.message || 'Identifiants incorrects.';
      errDiv.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    }
  } catch (err) {
    errDiv.textContent = 'Erreur de connexion au serveur.';
    errDiv.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}
</script>
</body>
</html>
